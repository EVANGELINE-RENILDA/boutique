<!-- <div class="order-container" *ngIf="orderItems.length > 0; else emptyOrder"> -->
  <h2>Your Order Summary 🧾</h2>

  <div class="order-item" *ngFor="let item of orderItems">
    <img [src]="item.image" [alt]="item.name" />
    <div class="order-details">
      <h3>{{ item.name }}</h3>
      <p>Quantity: {{ item.quantity }}</p>
      <p>Price: ₹{{ item.price }}</p>
      <p><strong>Total: ₹{{ item.price * item.quantity }}</strong></p>
    </div>
  </div>

  <div class="final-summary">
    <h3>Grand Total: ₹{{ total }}</h3>
    <button class="confirm-btn" (click)="confirmOrder()">✅ Confirm Order</button>
  </div>
<!-- </div> -->

<ng-template #emptyOrder>
  <div class="empty-order">
    <h2>No order found 😕</h2>
    <button (click)="backToCart()">⬅ Go Back to Cart</button>
  </div>
</ng-template>
