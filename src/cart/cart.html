<!-- <div class="cart-container" *ngIf="cartItems.length > 0; else emptyCart"> -->
  <div class="cart-item" *ngFor="let item of cartItems; let i = index">
    <img [src]="item.image" [alt]="item.name" />

    <div class="cart-details">
      <h2>{{ item.name }}</h2>
      <p>Price: ₹{{ item.price }}</p>

      <div class="quantity-controls">
        <label>Quantity:</label>
        <div class="qty-btns">
          <button (click)="decrement(i)">-</button>
          <span>{{ quantities[i] }}</span>
          <button (click)="increment(i)">+</button>
        </div>
      </div>

      <p class="total">Item Total: ₹{{ item.price * quantities[i] }}</p>

      <button class="remove-btn" (click)="removeItem(i)">Remove</button>
    </div>
  </div>

  <div class="cart-summary">
    <p class="grand-total">Grand Total: ₹{{ total }}</p>
    <div class="cart-actions">
      <button class="back-btn" (click)="backToShop()">⬅ Back to Shop</button>
      <button class="order-btn" (click)="orderNow()">Order Now 🛒</button>
    </div>
  </div>
<!-- </div> -->

<ng-template #emptyCart>
  <div class="empty-cart">
    <h2>Your cart is empty 😢</h2>
    <button class="back-btn" (click)="backToShop()">⬅ Start Shopping</button>
  </div>
</ng-template>
