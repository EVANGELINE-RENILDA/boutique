<div class="contact-container">
  <!-- Left Side - Info -->
  <div class="contact-info">
    <h2>Get in Touch 💖</h2>
    <p><strong>Phone:</strong> +91 98765 43210</p>
    <a href="mailto:niya@boutique.com" target="_blank" rel="noopener noreferrer">
      niya&#64;boutique.com
    </a>
    <p><strong>Address:</strong> 123, Fashion Street, Chennai</p>
  </div>

  <!-- Right Side - Form -->
  <div class="contact-form">
    <form (submit)="sendEmail($event)">
      <input type="text" name="user_name" placeholder="Your Name" required />
      <input type="email" name="user_email" placeholder="Your Email" required />
      <input type="tel" name="user_phone" placeholder="Your Phone" />

      <select name="subject" required>
        <option value="">Select Subject</option>
        <option value="inquiry">General Inquiry</option>
        <option value="support">Support</option>
        <option value="feedback">Feedback</option>
      </select>

      <textarea name="message" placeholder="Your Message" rows="5" required></textarea>

      <div class="d-flex jstw-btn">
        <a href="https://wa.me/918220186475?text=Hello%20Niya%20Boutique!" target="_blank" rel="noopener noreferrer">
          Message us on WhatsApp
        </a>
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>
</div>
